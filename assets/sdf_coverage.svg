<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 290" width="920" height="290" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
  <rect width="920" height="290" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Left Panel: Continuous SDF to Sub-Voxel Box Filter -->
  <text x="28" y="34" font-size="13.5" font-weight="700" fill="#0f172a">A. Sub-Voxel Anti-Aliased Coverage (4 LDU = 1/5 Stud)</text>
  <g transform="translate(36, 56)">
    <!-- 5x4 grid representing 4-LDU cells -->
    <rect x="0" y="0" width="360" height="180" fill="#f8fafc" stroke="#cbd5e1"/>
    <!-- Filled inside cells -->
    <rect x="0" y="90" width="90" height="90" fill="#bfdbfe"/>
    <rect x="90" y="90" width="90" height="90" fill="#93c5fd"/>
    <rect x="180" y="90" width="90" height="90" fill="#60a5fa"/>
    <rect x="0" y="45" width="90" height="45" fill="#93c5fd"/>
    <rect x="90" y="45" width="90" height="45" fill="#dbeafe"/>
    <!-- Partial surface band cells -->
    <rect x="180" y="45" width="90" height="45" fill="#eff6ff"/>
    <rect x="270" y="90" width="90" height="90" fill="#eff6ff"/>

    <!-- Grid lines -->
    <g stroke="#cbd5e1" stroke-width="1">
      <line x1="90" y1="0" x2="90" y2="180"/>
      <line x1="180" y1="0" x2="180" y2="180"/>
      <line x1="270" y1="0" x2="270" y2="180"/>
      <line x1="0" y1="45" x2="360" y2="45"/>
      <line x1="0" y1="90" x2="360" y2="90"/>
      <line x1="0" y1="135" x2="360" y2="135"/>
    </g>

    <!-- Continuous curved surface boundary phi=0 -->
    <path d="M -5 30 Q 150 28 320 185" fill="none" stroke="#2563eb" stroke-width="3.2"/>
    <text x="155" y="24" font-size="11" font-weight="700" fill="#2563eb">phi(x) = 0 Surface</text>

    <!-- Cell center dots & values -->
    <circle cx="45" cy="112" r="3" fill="#0f172a"/>
    <text x="53" y="116" font-size="10.5" font-weight="600" fill="#0f172a">t = 1.00</text>
    <circle cx="225" cy="67" r="3" fill="#2563eb"/>
    <text x="233" y="71" font-size="10.5" font-weight="600" fill="#1e40af">t = 0.42</text>
    <circle cx="315" cy="22" r="3" fill="#64748b"/>
    <text x="282" y="18" font-size="10.5" fill="#64748b">t = 0.00</text>

    <text x="0" y="204" font-size="11" fill="#475569">No binary staircase: fractional t preserves true slopes &amp; thin walls</text>
  </g>

  <!-- Divider -->
  <line x1="440" y1="24" x2="440" y2="266" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Right Panel: SAT Box - Sparse Slope Deficits -->
  <text x="466" y="34" font-size="13.5" font-weight="700" fill="#0f172a">B. O(1) Brick Scoring via SAT + Sparse Deficits</text>
  <g transform="translate(476, 60)">
    <!-- Solid Bounding Box (SAT query) -->
    <rect x="0" y="14" width="130" height="130" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="65" y="84" font-size="12" font-weight="700" text-anchor="middle" fill="#1e3a8a">Box Sum S(B)</text>
    <text x="65" y="102" font-size="10.5" text-anchor="middle" fill="#2563eb">O(1) via 8 corners</text>

    <text x="152" y="84" font-size="22" font-weight="700" text-anchor="middle" fill="#0f172a">-</text>

    <!-- Deficit triangle -->
    <g transform="translate(174, 14)">
      <rect x="0" y="0" width="130" height="130" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-dasharray="4 3"/>
      <polygon points="0,0 130,0 130,130" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/>
      <polygon points="0,0 130,130 0,130" fill="#2563eb" fill-opacity="0.16" stroke="#2563eb" stroke-width="1.8"/>
      <text x="86" y="42" font-size="11" font-weight="600" text-anchor="middle" fill="#475569">Deficit</text>
      <text x="86" y="57" font-size="10.5" text-anchor="middle" fill="#64748b">1 - V[q]</text>
      <text x="44" y="102" font-size="11" font-weight="700" text-anchor="middle" fill="#1e40af">Part Solid</text>
    </g>

    <!-- Result Formula -->
    <rect x="0" y="160" width="404" height="44" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="202" y="180" font-size="11.5" font-weight="600" text-anchor="middle" fill="#0f172a">Gain(p) = (1 + theta) * overlap - (theta + lambda) * spill</text>
    <text x="202" y="196" font-size="10.5" text-anchor="middle" fill="#64748b">Updated via Dinkelbach theta* until Soft-IoU converges</text>
  </g>
</svg>
