<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 260" width="980" height="260" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
  <rect width="980" height="260" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#2563eb"/>
    </marker>
    <marker id="arrowMuted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#64748b"/>
    </marker>
  </defs>

  <text x="28" y="34" font-size="14" font-weight="700" fill="#0f172a">BrickPack SDF Architecture — Continuous Signed Distance to Discrete LEGO Assembly</text>

  <!-- Node 1: Mesh / SDF Input -->
  <rect x="28" y="62" width="168" height="122" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="112" y="88" font-size="12.5" font-weight="700" text-anchor="middle" fill="#0f172a">1. Mesh Adapter</text>
  <text x="112" y="109" font-size="11" text-anchor="middle" fill="#475569">OBJ · GLB · PLY</text>
  <text x="112" y="128" font-size="10.5" text-anchor="middle" fill="#64748b">UV PNG Textures</text>
  <text x="112" y="144" font-size="10.5" text-anchor="middle" fill="#64748b">+ Vertex Colors</text>
  <rect x="52" y="156" width="120" height="18" rx="4" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="112" y="169" font-size="10" font-weight="600" text-anchor="middle" fill="#2563eb">or .sdf.json/.bin</text>

  <line x1="196" y1="123" x2="226" y2="123" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Node 2: Implicit Target SDF -->
  <rect x="228" y="62" width="184" height="122" rx="10" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="320" y="88" font-size="12.5" font-weight="700" text-anchor="middle" fill="#1e3a8a">2. Target SDF Field</text>
  <text x="320" y="109" font-size="11" text-anchor="middle" fill="#1e40af">BVH Closest Distance</text>
  <text x="320" y="126" font-size="11" text-anchor="middle" fill="#1e40af">+ Barnes-Hut GWN Sign</text>
  <text x="320" y="146" font-size="10.5" text-anchor="middle" fill="#3b82f6">t = clamp(0.5 - phi / 4, 0, 1)</text>
  <text x="320" y="165" font-size="10" text-anchor="middle" fill="#475569">4-LDU Sub-voxels + Thin Open</text>

  <line x1="412" y1="123" x2="442" y2="123" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Node 3: Solver -->
  <rect x="444" y="62" width="218" height="122" rx="10" fill="#f8fafc" stroke="#2563eb" stroke-width="2"/>
  <text x="553" y="88" font-size="12.5" font-weight="700" text-anchor="middle" fill="#0f172a">3. BrickPack Optimizer</text>
  <text x="553" y="109" font-size="11" text-anchor="middle" fill="#334155">O(1) 3D Summed Area Table</text>
  <text x="553" y="126" font-size="11" text-anchor="middle" fill="#334155">+ Sparse Slope Deficits</text>
  <text x="553" y="145" font-size="10.5" font-weight="600" text-anchor="middle" fill="#2563eb">Dinkelbach Soft-IoU + LNS</text>
  <text x="553" y="165" font-size="10" text-anchor="middle" fill="#64748b">WebGPU Compute · NumPy · JS</text>

  <line x1="662" y1="123" x2="692" y2="123" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Node 4: Outputs -->
  <rect x="694" y="62" width="258" height="122" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="823" y="88" font-size="12.5" font-weight="700" text-anchor="middle" fill="#0f172a">4. Official Output</text>
  <text x="823" y="109" font-size="11" text-anchor="middle" fill="#334155">CIEDE2000 -> 173 LDraw Colors</text>
  <text x="823" y="128" font-size="10.5" text-anchor="middle" fill="#475569">Python / Node CLI -> Binary .glb + .ldr</text>
  <text x="823" y="145" font-size="10.5" text-anchor="middle" fill="#475569">Browser JS -> Interactive WebGL2</text>
  <rect x="748" y="156" width="150" height="18" rx="4" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="823" y="169" font-size="10" font-weight="600" text-anchor="middle" fill="#2563eb">GA Tuned Hyperparameters</text>

  <!-- Bottom Catalog Box feeding Solver -->
  <rect x="290" y="204" width="526" height="40" rx="8" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="553" y="228" font-size="11" font-weight="600" text-anchor="middle" fill="#334155">99 OMR LDraw Part SDFs (1-LDU EDT² + Stud CSG) · 4-LDU Yaw Stencils · Custom Mesh Parts</text>
  <line x1="553" y1="204" x2="553" y2="186" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrowMuted)"/>
</svg>
